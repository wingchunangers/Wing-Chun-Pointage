<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f6f7f9}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:18px 16px 40px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}.brand img{width:62px;height:62px;object-fit:contain;border-radius:12px}.brand h1{font-size:23px;margin:0}.sub{color:#6b7280;margin-top:3px;font-size:14px}
.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:15px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:180px}
label{font-size:13px;font-weight:600;color:#4b5563;display:block;margin-bottom:5px}
input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:white}
button{border:0;border-radius:12px;padding:11px 14px;min-height:44px;font-weight:650;cursor:pointer}
.primary{background:#111827;color:white}.soft{background:#eef0f3}.danger{background:#fee2e2;color:#991b1b}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap}.tabs .on{background:#111827;color:white}
.student{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #e5e7eb;border-radius:14px;margin:7px 0}
.student input{width:22px;height:22px}.name{flex:1;min-width:0}.muted{color:#6b7280;font-size:13px}
.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#eef0f3}.badge.pro{background:#e5e7eb}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{padding:12px;background:#f3f4f6;border-radius:14px}.kpi b{font-size:22px;display:block}
.notice{padding:12px;border-radius:14px;background:#f9fafb;color:#4b5563;font-size:13px}.hidden{display:none!important}.list{max-height:520px;overflow:auto}
@media(max-width:500px){.kpis{grid-template-columns:1fr 1fr}.kpi:last-child{grid-column:span 2}}
</style>

<div><h1>Wing Chun Angers</h1><div class="sub">Pointage des cours</div></div>
</div>

<div class="tabs">
<button class="on" data-tab="pointage">Pointage</button>
<button data-tab="eleves">Élèves</button>
<button data-tab="stats">Statistiques</button>
<button data-tab="sauvegarde">Sauvegarde</button>
</div>

<section id="pointage">
<div class="card">
<div class="row">
<div class="grow"><label>Date</label><input id="date" type="date"></div>
<div class="grow"><label>Cours</label><select id="course"></select></div>
</div>
<div class="kpis" style="margin-top:12px">
<div class="kpi"><span class="muted">Présents</span><b id="presentCount">0</b></div>
<div class="kpi"><span class="muted">Élèves</span><b id="studentCount">0</b></div>
<div class="kpi"><span class="muted">Taux</span><b id="rate">0%</b></div>
</div>
</div>
<div class="card">
<div class="row">
<button class="primary" id="all">Tout présent</button>
<button class="soft" id="none">Tout décocher</button>
<button class="soft" id="usual">Présences habituelles</button>
</div>
<div id="attendance" class="list"></div>
</div>
</section>

<section id="eleves" class="hidden">
<div class="card">
<h2>Élèves</h2>
<div class="row">
<div class="grow"><label>Nom / prénom</label><input id="newName" placeholder="Ex. Jean Dupont"></div>
<div class="grow"><label>Formule</label><select id="newPlan"><option value="1">1 cours / semaine — 200 €</option><option value="illimite">Illimité — 250 €</option></select></div>
<button class="primary" id="add">Ajouter</button>
</div>
</div>
<div class="card"><div id="students"></div></div>
</section>

<section id="stats" class="hidden">
<div class="card"><h2>Statistiques de la saison</h2><div id="statsList"></div></div>
</section>

<section id="sauvegarde" class="hidden">
<div class="card"><h2>Sauvegarde</h2>
<div class="notice">Fais régulièrement une sauvegarde JSON. Elle permet de récupérer les élèves et les présences sur un autre appareil.</div>
<div class="row" style="margin-top:12px">
<button class="primary" id="export">Exporter mes données</button>
<label style="margin:0"><button class="soft" id="importBtn">Importer une sauvegarde</button><input id="importFile" type="file" accept=".json" class="hidden"></label>
</div></div>
<div class="card"><button class="danger" id="reset">Effacer toutes les données</button></div>
</section>
</div>

<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("./sw.js").catch(()=>{});
const COURSES=[
["Lundi · 17h30–19h","lundi-1730"],["Mercredi · 17h30–19h","mercredi-1730"],
["Mercredi · 19h–20h30","mercredi-1900"],["Jeudi · 18h–20h","jeudi-1800"],["Samedi · 9h–11h","samedi-0900"]
];
const KEY="wingchun_pointage_v2";
let db=JSON.parse(localStorage.getItem(KEY)||'{"students":[],"records":{}}');
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function isoToday(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()).toISOString().slice(0,10)}
function todayCourse(){const day=new Date().getDay();const map={1:"lundi-1730",3:"mercredi-1730",4:"jeudi-1800",6:"samedi-0900"};return map[day]||"lundi-1730"}
$("date").value=isoToday();COURSES.forEach(([n,v])=>$("course").add(new Option(n,v)));$("course").value=todayCourse();
function recKey(){return $("date").value+"|"+$("course").value}
function render(){
 const r=db.records[recKey()]||{},list=$("attendance");list.innerHTML="";
 $("studentCount").textContent=db.students.length;
 db.students.forEach((s,i)=>{const row=document.createElement("div");row.className="student";
 const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!r[i];
 cb.addEventListener("change",()=>{const x=db.records[recKey()]||{};if(cb.checked)x[i]=1;else delete x[i];db.records[recKey()]=x;save();render()});
 const n=document.createElement("div");n.className="name";n.textContent=s.name;
 const b=document.createElement("span");b.className="badge"+(s.plan==="illimite"?" pro":"");b.textContent=s.plan==="illimite"?"Illimité":"1 cours";
 row.append(cb,n,b);list.append(row)});
 const p=Object.keys(r).length;$("presentCount").textContent=p;$("rate").textContent=db.students.length?Math.round(p/db.students.length*100)+"%":"0%";renderStats()
}
function renderStudents(){const el=$("students");el.innerHTML="";db.students.forEach((s,i)=>{const row=document.createElement("div");row.className="student";
 const n=document.createElement("div");n.className="name";n.innerHTML="<b>"+esc(s.name)+"</b><div class='muted'>"+(s.plan==="illimite"?"Illimité · 250 €":"1 cours / semaine · 200 €")+"</div>";
 const del=document.createElement("button");del.className="danger";del.textContent="Suppr.";del.onclick=()=>{if(confirm("Supprimer "+s.name+" ?")){db.students.splice(i,1);Object.values(db.records).forEach(r=>{const nr={};Object.keys(r).forEach(k=>{let x=+k;if(x!==i)nr[x>i?x-1:x]=r[k]});});save();render();renderStudents()}};row.append(n,del);el.append(row)})}
function renderStats(){const el=$("statsList");el.innerHTML="";if(!db.students.length){el.innerHTML="<div class='muted'>Ajoute d’abord tes élèves.</div>";return}
 const keys=Object.keys(db.records);db.students.map((s,i)=>{let n=0;keys.forEach(k=>{if(db.records[k][i])n++});return{s,n}}).sort((a,b)=>b.n-a.n).forEach(x=>{const d=document.createElement("div");d.className="student";d.innerHTML="<div class='name'><b>"+esc(x.s.name)+"</b><div class='muted'>"+(x.s.plan==="illimite"?"Illimité":"1 cours / semaine")+"</div></div><b>"+x.n+" présence"+(x.n>1?"s":"")+"</b>";el.append(d)})}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("add").onclick=()=>{const n=$("newName").value.trim();if(!n)return;db.students.push({name:n,plan:$("newPlan").value});$("newName").value="";save();render();renderStudents()};
$("newName").onkeydown=e=>{if(e.key==="Enter")$("add").click()};$("date").onchange=render;$("course").onchange=render;
$("all").onclick=()=>{const r={};db.students.forEach((_,i)=>r[i]=1);db.records[recKey()]=r;save();render()};
$("none").onclick=()=>{delete db.records[recKey()];save();render()};
$("usual").onclick=()=>{const r={};db.students.forEach((s,i)=>{if(s.usual&&s.usual.includes($("course").value))r[i]=1});db.records[recKey()]=r;save();render()};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("on"));b.classList.add("on");["pointage","eleves","stats","sauvegarde"].forEach(id=>$(id).classList.toggle("hidden",id!==b.dataset.tab));renderStudents();renderStats()});
$("export").onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="wing-chun-pointage-sauvegarde.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("importBtn").onclick=()=>$("importFile").click();$("importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x.students||!x.records)throw Error();db=x;save();render();renderStudents();alert("Sauvegarde importée.")}catch{alert("Fichier de sauvegarde invalide.")}};rd.readAsText(f)};
$("reset").onclick=()=>{if(confirm("Tout effacer, élèves et présences ?")){db={students:[],records:{}};save();render();renderStudents()}};render();renderStudents();
</script>
</body>
</html>
